<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ホットケーキデコレーションゲーム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <div class="grade-label">グレード</div>
      <div class="grade-value" id="grade-value">0</div>
    </div>
    <div class="hud-center">
      <div class="grade-bar-wrap">
        <div class="grade-bar" id="grade-bar"></div>
        <div class="grade-bar-mark" style="left:71.4%"></div>
      </div>
      <div class="breakdown" id="breakdown">
        <span>盛り <b id="bd-cov">0</b></span>
        <span>均衡 <b id="bd-bal">0</b></span>
        <span>散らばり <b id="bd-sp">0</b></span>
        <span>はみ出し <b id="bd-of">0</b></span>
        <span>彩り <b id="bd-bo">0</b></span>
      </div>
    </div>
    <div class="hud-right">
      <button id="btn-sound"   class="btn btn-circle" aria-label="サウンド切替" title="サウンド">🔊</button>
      <button id="btn-help"    class="btn btn-circle" aria-label="遊び方" title="遊び方">?</button>
      <button id="btn-ranking" class="btn btn-circle" aria-label="ランキング" title="ランキング">🏆</button>
      <button id="btn-gallery" class="btn btn-circle" aria-label="ギャラリー" title="マイギャラリー">📚</button>
      <button id="btn-finish" class="btn primary">完 成</button>
      <button id="btn-reset" class="btn">やり直し</button>
    </div>
  </header>

  <canvas id="stage"></canvas>

  <div id="result-overlay" class="hidden">
    <div class="result-card">
      <div class="result-title" id="result-title">完成！</div>
      <div class="result-grade-label">最終グレード</div>
      <div class="result-grade" id="result-grade">0</div>
      <div class="result-rank" id="result-rank">修行中…</div>
      <div class="result-stars" id="result-stars"></div>
      <form id="submit-form" class="submit-form" autocomplete="off">
        <label class="submit-label" for="player-name">🏆 ランキングに登録</label>
        <div class="submit-row">
          <input type="text" id="player-name" maxlength="20" placeholder="ニックネーム" required>
          <button type="submit" id="btn-submit-score" class="btn primary">登録</button>
        </div>
        <div class="submit-status" id="submit-status"></div>
      </form>
      <div class="result-actions">
        <button id="btn-save-gallery" class="btn">📚 ギャラリーに保存</button>
        <button id="btn-show-ranking" class="btn">🏆 ランキングを見る</button>
        <button id="btn-again" class="btn primary">もう一度</button>
      </div>
    </div>
  </div>

  <div id="ranking-overlay" class="hidden">
    <div class="ranking-card">
      <div class="ranking-header">
        <div class="ranking-title">🏆 グローバルランキング</div>
        <button id="btn-ranking-close" class="btn btn-circle ranking-close" aria-label="閉じる" title="閉じる">×</button>
      </div>
      <div class="ranking-status" id="ranking-status">読み込み中…</div>
      <div class="ranking-table-wrap">
        <table class="ranking-table">
          <thead>
            <tr><th>#</th><th>プレイヤー</th><th class="num">スコア</th><th class="date">日付</th></tr>
          </thead>
          <tbody id="ranking-tbody"></tbody>
        </table>
      </div>
      <button id="btn-ranking-reload" class="btn ranking-reload">再読み込み</button>
    </div>
  </div>

  <div id="gallery-overlay" class="hidden">
    <div class="gallery-card">
      <div class="gallery-header">
        <div class="gallery-title">📚 マイギャラリー <span class="gallery-count" id="gallery-count"></span></div>
        <button id="btn-gallery-close" class="btn btn-circle ranking-close" aria-label="閉じる" title="閉じる">×</button>
      </div>
      <div class="gallery-status" id="gallery-status"></div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </div>

  <div id="detail-overlay" class="hidden">
    <div class="detail-card">
      <button id="btn-detail-close" class="btn btn-circle ranking-close detail-close" aria-label="閉じる" title="閉じる">×</button>
      <div class="detail-image-wrap">
        <img id="detail-image" alt="保存したパンケーキ">
      </div>
      <div class="detail-info">
        <div class="detail-grade-label">最終グレード</div>
        <div class="detail-grade" id="detail-grade">0</div>
        <div class="detail-rank" id="detail-rank"></div>
        <ul class="detail-breakdown" id="detail-breakdown"></ul>
        <div class="detail-date" id="detail-date"></div>
      </div>
      <div class="detail-actions">
        <button id="btn-detail-download" class="btn">📥 ダウンロード</button>
        <button id="btn-detail-delete" class="btn btn-danger">🗑 削除</button>
      </div>
    </div>
  </div>

  <div id="premium-toast" class="hidden">✨ PREMIUM UNLOCKED ✨</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
